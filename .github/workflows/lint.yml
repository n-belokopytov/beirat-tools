name: Lint

on: [push, pull_request]

jobs:
  ruff-black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black
      - name: Lint weg-top-tracker-repo
        working-directory: weg-top-tracker-repo
        run: |
          ruff check src
          black --check src
